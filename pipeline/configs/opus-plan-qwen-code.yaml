# Opus plans, Qwen codes. Best value for complex tasks.
# Opus understands architecture and writes better PLAN.md files.
# Qwen executes the plan at 250x less cost.
#
# Usage:
#   cloding pipeline "Add authentication" -c configs/opus-plan-qwen-code.yaml --workspace ./myapp --no-docker

name: "opus-plan-qwen-code"

models:
  opus:
    provider: openrouter
    model_id: anthropic/claude-opus-4.6
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api"
    cost_per_mtok_input: 15.0
    cost_per_mtok_output: 75.0

  qwen:
    provider: openrouter
    model_id: qwen/qwen3-coder-next
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api"
    cost_per_mtok_input: 0.07
    cost_per_mtok_output: 0.30

stages:
  # Opus plans — reads the codebase, writes a detailed PLAN.md
  - name: plan
    model: opus
    prompt_file: prompts/plan.txt
    max_turns: 30
    max_budget_usd: 5.00
    timeout_seconds: 600
    allowed_tools: [Read, Grep, Glob, Write]

  # Qwen explores — maps the codebase, writes CONTEXT.md
  - name: explore
    model: qwen
    prompt_file: prompts/explore.txt
    max_turns: 20
    max_budget_usd: 0.50
    timeout_seconds: 600
    allowed_tools: [Read, Grep, Glob, Bash, Write]

  # Qwen codes — implements each task from PLAN.md
  - name: code
    model: qwen
    prompt_file: prompts/code.txt
    max_turns: 50
    max_budget_usd: 1.00
    timeout_seconds: 900

fanout:
  enabled: true
  max_parallel: 3

# No review stage — you review it yourself
review:
  max_iterations: 0
  pass_threshold: "PASS"
