name: "quick"

# Minimal pipeline: skip explore, single review iteration
# Good for small changes where full exploration isn't needed

models:
  opus:
    provider: openrouter
    model_id: anthropic/claude-opus-4.6
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    cost_per_mtok_input: 15.0
    cost_per_mtok_output: 75.0

  qwen:
    provider: openrouter
    model_id: qwen/qwen3-coder-next
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    cost_per_mtok_input: 0.07
    cost_per_mtok_output: 0.30

stages:
  - name: plan
    model: opus
    prompt_file: prompts/plan.txt
    max_turns: 20
    max_budget_usd: 2.00
    timeout_seconds: 300
    allowed_tools: [Read, Grep, Glob, Write]

  - name: code
    model: qwen
    prompt_file: prompts/code.txt
    max_turns: 80
    max_budget_usd: 1.50
    timeout_seconds: 600

  - name: review
    model: opus
    prompt_file: prompts/review.txt
    max_turns: 15
    max_budget_usd: 1.50
    timeout_seconds: 300
    allowed_tools: [Read, Grep, Glob, Bash]
    disallowed_tools: [Edit, Write]

fanout:
  enabled: false

review:
  max_iterations: 1
  pass_threshold: "PASS"

docker:
  image: cloding:latest
  network: cloding-net
