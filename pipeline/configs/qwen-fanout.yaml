name: "qwen-fanout"

# All-Qwen fan-out test: you write PLAN.md, Qwen explores + codes in parallel.
# No plan or review stages — pure Qwen, minimal cost.

models:
  qwen:
    provider: openrouter
    model_id: qwen/qwen3-coder-next
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api"
    cost_per_mtok_input: 0.12
    cost_per_mtok_output: 0.75

stages:
  - name: explore
    model: qwen
    prompt_file: prompts/explore.txt
    max_turns: 20
    max_budget_usd: 0.50
    timeout_seconds: 600
    allowed_tools: [Read, Grep, Glob, Bash, Write]

  - name: code
    model: qwen
    prompt_file: prompts/code.txt
    max_turns: 40
    max_budget_usd: 1.00
    timeout_seconds: 600

fanout:
  enabled: true
  max_parallel: 3

review:
  max_iterations: 0
  pass_threshold: "PASS"

docker:
  image: cloding:latest
  network: cloding-net
