name: "qwen-tools-test"

# Test config: Qwen handles EVERYTHING — explore + code.
# This tests how Qwen handles tools (Read, Grep, Glob, Write, Bash).
# You write PLAN.md, Qwen explores AND codes.

models:
  qwen:
    provider: openrouter
    model_id: qwen/qwen3-coder-next
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api"
    cost_per_mtok_input: 0.07
    cost_per_mtok_output: 0.30

stages:
  - name: explore
    model: qwen
    prompt_file: prompts/explore.txt
    max_turns: 25
    max_budget_usd: 0.50
    timeout_seconds: 600
    allowed_tools: [Read, Grep, Glob, Bash, Write]

  - name: code
    model: qwen
    prompt_file: prompts/code.txt
    max_turns: 50
    max_budget_usd: 0.50
    timeout_seconds: 600

fanout:
  enabled: false

review:
  max_iterations: 0
  pass_threshold: "PASS"
