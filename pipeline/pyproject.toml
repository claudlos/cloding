[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloding"
version = "0.1.0"
description = "Cloding — Claude Code with any model via OpenRouter. Multi-model pipeline orchestrator."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
cloding-pipeline = "osq.cli.main:main"

[tool.setuptools.packages.find]
include = ["osq*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:anchorpy"

[tool.coverage.run]
source = ["osq"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
